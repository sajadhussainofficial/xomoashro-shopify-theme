# Shopify CLI settings for this repository.
#
# The theme lives in `xomoashro-them/`, not at the repository root. The `default`
# environment is applied automatically, so `shopify theme dev`, `shopify theme push`
# and the other theme commands work from the repository root without extra flags.
#
# `nodelete` stops the CLI from deleting files in the remote theme when they are
# missing locally (for example in the middle of a branch switch). Real deletions
# are done deliberately with `shopify theme push` at launch (phase P24).

[environments.default]
store = "https-xomoashro-com-fcrv98st.myshopify.com"
path = "xomoashro-them"
nodelete = true
