mutation UpdateMenu($id: ID!, $title: String!, $handle: String!, $items: [MenuItemUpdateInput!]!) {
  menuUpdate(id: $id, title: $title, handle: $handle, items: $items) {
    menu {
      id
      handle
      items {
        title
        url
        items {
          title
          url
        }
      }
    }
    userErrors {
      field
      message
      code
    }
  }
}
